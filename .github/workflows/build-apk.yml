
name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. 下载仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 配置 Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      # 4. 配置 Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 5. 解压 Android 项目
      - name: Unzip Android project
        run: |
          mkdir -p source

          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -type f | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "找不到项目 ZIP 文件"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d source

          echo "项目解压完成"

      # 6. 自动寻找 Android 项目目录
      - name: Locate Android project
        id: project
        run: |
          SETTINGS=$(find source -name settings.gradle.kts -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "找不到 settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "找不到 app/build.gradle.kts"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "项目目录：$PROJECT_DIR"

      # 7. 修复 Java 兼容性
      - name: Fix Java compatibility
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")

          block = """compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }"""

          if re.search(r'compileOptions\s*\{', s):
              s = re.sub(
                  r'compileOptions\s*\{[^}]*\}',
                  block,
                  s,
                  count=1
              )
          else:
              s, n = re.subn(
                  r'android\s*\{',
                  lambda m: m.group(0) + '\n    ' + block,
                  s,
                  count=1
              )

              if n == 0:
                  raise SystemExit("找不到 android 配置块")

          p.write_text(s, encoding="utf-8")

          print("Java 编译目标已设置为 17")
          PY

      # 8. 编译 APK
      - name: Build APK
        run: |
          cd "${{ steps.project.outputs.dir }}"

          gradle --no-daemon --stacktrace assembleDebug

      # 9. 检查 APK 是否生成
      - name: Verify APK
        run: |
          mkdir -p output

          find source -type f \
            -path '*/app/build/outputs/apk/debug/*.apk' \
            -exec cp {} output/ \;

          if ! ls output/*.apk >/dev/null 2>&1; then
            echo "没有找到生成的 APK"
            exit 1
          fi

          ls -lh output/

      # 10. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShipManufacturingReview-debug-apk
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14
