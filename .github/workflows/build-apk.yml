
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate and prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            for candidate in \
              /usr/local/lib/android/sdk \
              /opt/android-sdk \
              /usr/lib/android-sdk; do
              if [ -d "$candidate" ]; then
                SDK_ROOT="$candidate"
                break
              fi
            done
          fi

          if [ ! -d "$SDK_ROOT" ]; then
            echo "找不到 Android SDK 安装目录"
            exit 1
          fi

          echo "Android SDK: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)

          if [ -n "$SDKMANAGER" ]; then
            echo "找到 sdkmanager: $SDKMANAGER"
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

            "$SDKMANAGER" --install \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              "platform-tools"
          else
            echo "没有找到 sdkmanager，检查预装组件"

            if [ ! -f "$SDK_ROOT/platforms/android-35/android.jar" ]; then
              echo "缺少 Android 35 平台且无法找到 sdkmanager"
              find "$SDK_ROOT" -maxdepth 5 -type f | head -100
              exit 1
            fi

            if [ ! -d "$SDK_ROOT/build-tools/35.0.0" ]; then
              echo "缺少 Build Tools 35.0.0 且无法找到 sdkmanager"
              exit 1
            fi
          fi

          if [ ! -f "$SDK_ROOT/platforms/android-35/android.jar" ]; then
            echo "Android 35 安装检查失败"
            exit 1
          fi

          if [ ! -d "$SDK_ROOT/build-tools/35.0.0" ]; then
            echo "Build Tools 安装检查失败"
            exit 1
          fi

          echo "Android SDK 检查通过"

      - name: Check build environment
        run: |
          java -version
          gradle --version
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms/android-35"

      - name: Unzip Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source

          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "没有找到项目 ZIP 文件"
            exit 1
          fi

          echo "正在解压: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source

          echo "解压完成，项目文件："
          find source -maxdepth 3 -type f | head -80

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find source -type f -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "找不到 settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "找不到 app/build.gradle.kts"
            exit 1
          fi

          echo "项目目录: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          gradle --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          find source -type f \
            -path '*/app/build/outputs/apk/debug/*.apk' \
            -exec cp {} output/ \;

          if ! find output -type f -name '*.apk' | grep -q .; then
            echo "编译结束，但没有找到 APK"
            find source -type f -name '*.apk'
            exit 1
          fi

          echo "APK 已生成："
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShipManufacturingReview-debug-apk
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14
