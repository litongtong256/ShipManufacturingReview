
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")

          compile_options = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }"""

          if re.search(r'compileOptions\s*\{', s):
              s = re.sub(
                  r'compileOptions\s*\{.*?\}',
                  compile_options,
                  s,
                  count=1,
                  flags=re.S
              )
          else:
              s, count = re.subn(
                  r'(android\s*\{)',
                  r'\1\n' + compile_options,
                  s,
                  count=1
              )
              if count == 0:
                  raise SystemExit("找不到 android 配置块")

          p.write_text(s, encoding="utf-8")
          print("已将 Java 编译目标统一设置为 17")
          PY

          gradle --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug
